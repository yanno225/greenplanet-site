# Nginx en façade du site Next.js (qui écoute sur le port 3000 via PM2).
# À copier dans /etc/nginx/sites-available/greenplanet puis activer avec un lien
# symbolique dans /etc/nginx/sites-enabled/. Remplacer VOTRE-DOMAINE.com.
# Certbot ajoutera lui-même le bloc HTTPS (port 443) et la redirection.

server {
    listen 80;
    listen [::]:80;
    server_name VOTRE-DOMAINE.com www.VOTRE-DOMAINE.com;

    # Taille max des requêtes (formulaire de contact)
    client_max_body_size 2m;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Fichiers statiques générés par Next : cache long
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vidéos, images, logos : cache 7 jours
    location ~* \.(mp4|webm|jpg|jpeg|png|svg|ico|woff2)$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
